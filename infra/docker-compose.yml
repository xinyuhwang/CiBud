# Local development services for CiBud.
#   docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cibud
      POSTGRES_PASSWORD: cibud
      POSTGRES_DB: cibud
    ports:
      - "${CIBUD_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cibud -d cibud"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    # CRF-only image: ~0.5 GB, native on amd64 and arm64 (Apple Silicon).
    # The "-full" image adds deep-learning models for somewhat better header and
    # reference parsing, but is ~15 GB and amd64-only. To use it on a Linux/amd64 host:
    #   CIBUD_GROBID_IMAGE=grobid/grobid:0.9.1-full docker compose ... up -d
    image: ${CIBUD_GROBID_IMAGE:-grobid/grobid:0.9.1-crf}
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
