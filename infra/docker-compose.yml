# Local development services for CiBud.
#   docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cibud
      POSTGRES_PASSWORD: cibud
      POSTGRES_DB: cibud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cibud -d cibud"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    # Full image includes the deep-learning models used for header and
    # reference parsing. It is large (~10 GB) and slow to start.
    image: grobid/grobid:0.8.1
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8070/api/isalive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
