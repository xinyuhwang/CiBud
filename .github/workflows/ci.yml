name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cibud
          POSTGRES_PASSWORD: cibud
          POSTGRES_DB: cibud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cibud -d cibud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIBUD_TEST_DATABASE_URL: postgresql+psycopg://cibud:cibud@localhost:5432/cibud_test
      CIBUD_DATABASE_URL: postgresql+psycopg://cibud:cibud@localhost:5432/cibud_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: Models and migrations are in sync
        run: uv run alembic check
      - name: Validate eval templates
        run: uv run cibud-eval validate ../eval/templates
